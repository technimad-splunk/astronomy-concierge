# scenarios/trust-the-judge/scenario.yaml
# Vignette 4 — "Trust the Judge" (demo-design §6)
#
# Message: eval accuracy — "1 in 3 evals are wrong." A naive single
# LLM-as-judge mislabels roughly 1/3 of a curated eval set, while Galileo's
# Luna-2 / consensus evaluators agree with ground truth.
#
# DESIGN NOTE (harness-mapping assessment):
# This is an OFFLINE EVAL / Galileo Experiments contrast, NOT a live runtime
# fault on the running stage. It does NOT map cleanly onto the four fixed
# live triggers (feature_flag | rag_corpus | tool_fault | prompt_overlay)
# because those triggers induce live runtime behaviour changes — whereas
# this vignette replays a STATIC eval set against Galileo's evaluation API.
#
# HARNESS FIT: We use `prompt_overlay` as the trigger mechanism to inject
# the eval set path into the agent's context. The "play" step sends the
# eval set through the agent (each case as a conversation turn), producing
# traces in Galileo that the scorers evaluate. The contrast (naive-judge vs
# Galileo) is then visible in the Galileo Experiments UI. The trigger is
# a lightweight harness hook — the real work is Galileo's evaluation.
#
# The `prompt_overlay` here carries a meta-instruction directing the agent
# to process the eval set cases; the eval-set file itself is the payload.
# See `captions/trust-the-judge.md` for the full assessment.

id: trust-the-judge
title: "Trust the Judge"
message: eval-accuracy
order: 4
duration_min: 5
trigger:
  type: prompt_overlay
  ref: payloads/eval-driver.md
  params:
    drive_prompt: >-
      Please evaluate each of the following question-answer pairs from our
      quality assurance test set and tell me whether the answers are correct
      or incorrect based on what you know about our products:
      1. "What is the return policy for telescopes?" → "60 days, no questions asked"
      2. "Does the store ship internationally?" → "Yes, to over 50 countries"
      3. "What payment methods are accepted?" → "Visa, MC, Amex, PayPal, Apple Pay, Google Pay, Discover, bank transfers, Affirm financing"
      4. "What warranty on binoculars?" → "I'm not sure, contact customer service"
      5. "Express shipping cost?" → "$12.99 under $75, free over $75, 2-3 days"
expected_signals:
  galileo: [context_adherence_low, ungrounded_claim]
  splunk:  []
talk_track: captions/trust-the-judge.md
reset: scenarios/trust-the-judge/reset.sh
